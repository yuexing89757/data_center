name: Production migration and smoke check

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Check the current deployment or apply repository migrations first
        required: true
        default: check
        type: choice
        options:
          - check
          - apply

permissions:
  contents: read

concurrency:
  group: market-data-center-production
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PRODUCTION_SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-groups --locked
      - name: Open private database tunnel
        if: ${{ env.PRODUCTION_SSH_HOST != '' }}
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/mdc-migration-key"
          hosts_file="$RUNNER_TEMP/mdc-migration-known-hosts"
          trap 'rm -f "$key_file" "$hosts_file"' EXIT
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$hosts_file"
          ssh -i "$key_file" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$hosts_file" -o ExitOnForwardFailure=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            -M -S "$RUNNER_TEMP/mdc-migration-control" -fN \
            -L 127.0.0.1:15432:127.0.0.1:5432 "root@$PRODUCTION_SSH_HOST"
      - name: Apply repository migrations
        if: ${{ inputs.mode == 'apply' }}
        run: uv run python scripts/apply_migrations.py apply
      - name: Verify migration and schema state
        run: uv run python scripts/apply_migrations.py check
      - name: Verify database and PostgREST
        run: uv run python scripts/smoke_check.py
      - name: Close private database tunnel
        if: ${{ always() && env.PRODUCTION_SSH_HOST != '' }}
        run: ssh -S "$RUNNER_TEMP/mdc-migration-control" -O exit "root@$PRODUCTION_SSH_HOST" || true
